name: Generate profile cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Commits only. SKYLINE_TOKEN is a read-only PAT so private repos count too; without it, or if real
      # data can't be fetched, the job fails and publishes nothing, keeping the last good chart.
      - name: Contribution skyline
        run: node .github/scripts/contribution-skyline.mjs --user ${{ github.repository_owner }} --commits --out dist
        env:
          SKYLINE_TOKEN: ${{ secrets.SKYLINE_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
